name: Sync temple photos

# Full-mirror reconciliation: Google Drive inbox -> R2 (or local-output,
# pre-Phase-2). Runs on a timer and can also be triggered manually. See
# README.md's "Photo sync pipeline" section for setup.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-photos
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Run Drive -> R2 sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_FOLDER_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          PUBLIC_SITE_URL: ${{ secrets.PUBLIC_SITE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          if [ -z "$GOOGLE_DRIVE_ROOT_FOLDER_ID" ]; then
            echo "GOOGLE_DRIVE_ROOT_FOLDER_ID secret isn't set yet — see README.md's Photo sync pipeline setup. Skipping this run."
            exit 0
          fi
          npm run sync:drive

  # GitHub switches off scheduled workflows after 60 days without a commit
  # (it did on 2026-10-31). Re-enabling the workflow through the API resets
  # that timer. Kept in its own job so only this tiny step gets actions:
  # write, and it never re-enables a workflow someone turned off by hand.
  keepalive:
    needs: sync
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Keep the schedule alive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW: repos/${{ github.repository }}/actions/workflows/sync-photos.yml
        run: |
          state=$(gh api "$WORKFLOW" --jq .state)
          if [ "$state" != "active" ]; then
            echo "Workflow is $state; leaving it alone."
            exit 0
          fi
          gh api -X PUT "$WORKFLOW/enable"
          echo "Inactivity timer reset."
